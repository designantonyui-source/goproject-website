<section id="$section_id" class="shared-faq $classes" aria-labelledby="$heading_id">
  <div class="$inner">
    <div class="faq-heading text-center max-w-3xl mx-auto mb-16">
      <span class="font-mono text-xs font-bold text-accent uppercase tracking-widest block mb-2">$label</span>
      <h2 id="$heading_id" class="font-heading font-extrabold text-3xl md:text-5xl">$title</h2>
    </div>
    <div class="faq-list space-y-4">$items</div>
  </div>
</section>
