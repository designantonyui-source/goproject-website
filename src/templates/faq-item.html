<div class="faq-item border border-gray-200 bg-studio-surface overflow-hidden">
  <button type="button" class="faq-toggle w-full p-6 text-left flex justify-between items-center font-heading font-bold text-lg hover:text-accent transition-colors" id="$button_id" aria-expanded="false" aria-controls="$answer_id">
    <span>$question</span>
    <span class="ms-icon ms-icon--medium text-accent" aria-hidden="true">keyboard_arrow_down</span>
  </button>
  <div id="$answer_id" class="faq-content hidden px-6 pb-6 text-gray-600 text-sm leading-relaxed border-t border-gray-200 pt-4" aria-labelledby="$button_id">$answer</div>
</div>
